services:
  web:
    build: .
    container_name: steam-friend-history-web-1
    ports:
      - "3000:3000"
    volumes:
      - ./backups:/app/backups
      - ./database:/app/database
      - ./logs:/var/log
      - ./utils:/app/utils
      - ./app_logs:/app/logs
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro      
    env_file:
      - .env
    environment:
      TZ: Asia/Taipei     
    # 註：原本的 dns 192.168.1.2/.3 已不在目前的 LAN (192.168.50.x)，每次查詢都要等 ~8 秒 timeout。
    # 不指定 dns 時 Docker 會沿用主機的 DNS 設定。
    restart: unless-stopped
    healthcheck: 
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 1m30s
      timeout: 10s
      retries: 3    
